<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>中国医科大学 - 政策咨询 Bot</title>
  <link rel="stylesheet" href="chatbot.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <main class="page">
    <section class="chat-container" aria-label="聊天窗口">
      <header class="chat-header">
        <div class="brand">
          <!-- 内嵌简单红色徽章（避免使用官方矢量） -->
          <div class="cmu-badge" aria-hidden="true">
            <svg width="44" height="44" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="logo">
              <defs>
                <linearGradient id="g" x1="0" x2="1">
                  <stop offset="0" stop-color="#d93b3b"/>
                  <stop offset="1" stop-color="#b71b1b"/>
                </linearGradient>
              </defs>
              <circle cx="50" cy="50" r="48" fill="url(#g)"/>
              <text x="50" y="57" font-size="36" font-family="Noto Sans SC, sans-serif" font-weight="700" fill="#fff" text-anchor="middle">中医大</text>
            </svg>
          </div>
          <div class="brand-text">
            <h1>中国医科大学 · 政策咨询助手</h1>
            <p class="sub">快速问答 · 显示引用条文</p>
          </div>
        </div>
        <div class="logo-note">官方信息请以法规原文为准</div>
      </header>

      <div class="chat-body">
        <div class="chat-messages" id="messages" role="log" aria-live="polite"></div>
      </div>

      <form class="chat-input" id="chatForm" onsubmit="return false;">
        <input id="userInput" type="text" placeholder="请输入问题（例如：关于医保报销的政策）回车发送..." autocomplete="off" />
        <button id="sendBtn" type="button">发送</button>
      </form>

      <footer class="chat-footer">提示：若 Bot 引用了法规条文，会在回复下方列出“引用条文”。</footer>
    </section>
  </main>

  <script>
    // ==== 已填入您的Cloudflare Worker域名 ====
    const API_ENDPOINT = "https://volcano-bot-proxy.1527360074.workers.dev/";
    // ========================================

    const messagesDiv = document.getElementById('messages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    addMessage('bot', '您好，我是中国医科大学政策咨询助手。请问有什么我可以帮您解答的政策问题？');

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function timeNow() {
      const d = new Date();
      return d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
    }

    function addMessage(role, content, citations = []) {
      const wrapper = document.createElement('div');
      wrapper.className = `message ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.textContent = role === 'user' ? '👤' : '🤖';

      const body = document.createElement('div');
      body.className = 'message-body';

      const bubble = document.createElement('div');
      bubble.className = 'message-content';
      bubble.innerHTML = escapeHtml(content).replace(/\n/g, '<br>');

      const meta = document.createElement('div');
      meta.className = 'message-meta';
      meta.textContent = timeNow();

      body.appendChild(bubble);

      if (Array.isArray(citations) && citations.length > 0) {
        const citeBox = document.createElement('div');
        citeBox.className = 'citation-box';

        const citeTitle = document.createElement('div');
        citeTitle.className = 'citation-title';
        citeTitle.textContent = '引用条文';

        citeBox.appendChild(citeTitle);

        citations.forEach((c) => {
          const item = document.createElement('div');
          item.className = 'citation-item';

          const t = document.createElement('div');
          t.className = 'citation-item-title';
          t.textContent = c.title || '条文';

          const txt = document.createElement('div');
          txt.className = 'citation-item-text';
          txt.innerHTML = escapeHtml(c.text || '').replace(/\n/g, '<br>');

          item.appendChild(t);
          item.appendChild(txt);

          if (c.url) {
            const a = document.createElement('a');
            a.className = 'citation-link';
            a.href = c.url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.textContent = '查看原文';
            item.appendChild(a);
          }

          citeBox.appendChild(item);
        });

        body.appendChild(citeBox);
      }

      body.appendChild(meta);

      if (role === 'user') {
        wrapper.appendChild(body);
        wrapper.appendChild(avatar);
      } else {
        wrapper.appendChild(avatar);
        wrapper.appendChild(body);
      }

      messagesDiv.appendChild(wrapper);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      addMessage('user', text);
      userInput.value = '';
      userInput.focus();
      addMessage('bot', '正在思考...');

      try {
        const response = await axios.post(API_ENDPOINT, { message: text });

        if (messagesDiv.lastChild && messagesDiv.lastChild.classList.contains('bot')) {
          messagesDiv.removeChild(messagesDiv.lastChild);
        }

        let replyText = '';
        let citations = [];

        if (response && response.data) {
          if (response.data.choices && response.data.choices[0]) {
            const m = response.data.choices[0].message || {};
            replyText = m.content || response.data.choices[0].text || '';
            if (m.citations) citations = m.citations;
          } else if (typeof response.data === 'string') {
            replyText = response.data;
          } else if (response.data.reply) {
            replyText = response.data.reply;
            if (response.data.citations) citations = response.data.citations;
          } else {
            replyText = response.data.content || JSON.stringify(response.data).slice(0, 1000);
            if (response.data.citations) citations = response.data.citations;
          }
        } else {
          replyText = '抱歉，未收到有效回复。';
        }

        if ((!citations || citations.length === 0) && typeof replyText === 'string') {
          const marker = '引用条文:';
          if (replyText.includes(marker)) {
            const parts = replyText.split(marker);
            replyText = parts[0].trim();
            const cited = parts[1].trim();
            if (cited) citations = [{ title: '引用节选', text: cited }];
          }
        }

        addMessage('bot', replyText || '（空回复）', citations);
      } catch (err) {
        if (messagesDiv.lastChild && messagesDiv.lastChild.classList.contains('bot')) {
          messagesDiv.removeChild(messagesDiv.lastChild);
        }
        addMessage('bot', '抱歉，网络或后端错误，无法获取回复。');
        console.error('API请求失败:', err);
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
